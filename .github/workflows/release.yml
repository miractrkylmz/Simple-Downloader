name: Build and Release APK

on:
  push:
    branches: [ master ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/debug/app-debug.apk release-apk/SimpleDownloader.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Simple Downloader v1.0.${{ github.run_number }}"
          body: |
            ### 🚀 Yeni Güncelleme (Otomatik Build)
            - **Tarih:** ${{ github.event.head_commit.timestamp || 'Otomatik' }}
            - **Son Commit:** ${{ github.event.head_commit.message || 'Manuel tetiklendi' }}
            
            📲 Aşağıdaki **SimpleDownloader.apk** dosyasını indirip telefonunuza kurabilirsiniz.
          files: release-apk/SimpleDownloader.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
